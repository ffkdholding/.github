<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EasyFleet — Web Preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080f1e;
      --sidebar: #060d1a;
      --card: #0d1f38;
      --border: rgba(0,198,255,0.1);
      --border-strong: rgba(0,198,255,0.25);
      --accent: #00c6ff;
      --green: #00e676;
      --warning: #ffb300;
      --danger: #ff4d4d;
      --text: #e2eaf4;
      --muted: #7a8fa8;
      --sidebar-w: 224px;
      --header-h: 52px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
      font-size: 14px;
    }

    /* PREVIEW BADGE */
    .preview-badge {
      position: fixed;
      bottom: 16px;
      right: 16px;
      background: rgba(0,198,255,0.12);
      border: 1px solid rgba(0,198,255,0.3);
      color: var(--accent);
      font-size: 11px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      z-index: 999;
      letter-spacing: 0.06em;
      cursor: default;
    }

    /* SIDEBAR */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 100;
    }

    .sidebar-logo {
      padding: 20px 18px 16px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-logo-text {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--text);
    }

    .sidebar-logo-text span { color: var(--accent); }

    .sidebar-logo-sub {
      font-size: 10px;
      color: var(--muted);
      margin-top: 3px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .sidebar-nav {
      flex: 1;
      padding: 12px 8px;
      overflow-y: auto;
    }

    .nav-section-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding: 10px 10px 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 8px;
      cursor: pointer;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      transition: all 0.15s;
      user-select: none;
      position: relative;
      margin-bottom: 2px;
    }

    .nav-item:hover { background: rgba(0,198,255,0.07); color: var(--text); }

    .nav-item.active {
      background: rgba(0,198,255,0.12);
      color: var(--accent);
    }

    .nav-item.active::before {
      content: '';
      position: absolute;
      left: 0; top: 6px; bottom: 6px;
      width: 3px;
      background: var(--accent);
      border-radius: 0 2px 2px 0;
    }

    .nav-icon { font-size: 15px; width: 20px; text-align: center; flex-shrink: 0; }

    .nav-badge {
      margin-left: auto;
      background: var(--danger);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 10px;
      min-width: 18px;
      text-align: center;
    }

    .sidebar-footer {
      padding: 12px;
      border-top: 1px solid var(--border);
    }

    .user-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      border-radius: 8px;
      cursor: pointer;
    }

    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00c6ff, #00e676);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: #060d1a;
      flex-shrink: 0;
    }

    .user-name { font-size: 12px; font-weight: 600; color: var(--text); }
    .user-role { font-size: 10px; color: var(--muted); }

    /* LAYOUT */
    .layout {
      margin-left: var(--sidebar-w);
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* TOPBAR */
    .topbar {
      height: var(--header-h);
      background: rgba(8,15,30,0.96);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .topbar-breadcrumb {
      flex: 1;
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }

    .topbar-actions { display: flex; align-items: center; gap: 8px; }

    .search-bar {
      height: 34px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      cursor: text;
      min-width: 200px;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      position: relative;
    }

    .notif-dot {
      width: 7px; height: 7px;
      background: var(--danger);
      border-radius: 50%;
      position: absolute;
      top: 5px; right: 5px;
      border: 1px solid var(--bg);
    }

    /* CONTENT */
    #content { flex: 1; padding: 24px; }

    /* COMMON */
    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 24px;
      gap: 16px;
    }

    .page-title { font-size: 20px; font-weight: 700; }
    .page-subtitle { font-size: 13px; color: var(--muted); margin-top: 3px; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .btn-primary { background: var(--accent); color: #060d1a; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); }
    .btn-ghost:hover { border-color: var(--border-strong); color: var(--text); }

    /* STATS */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }

    .stat-label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
    .stat-value { font-size: 26px; font-weight: 700; line-height: 1; }
    .stat-value.accent { color: var(--accent); }
    .stat-value.green { color: var(--green); }
    .stat-value.warning { color: var(--warning); }
    .stat-value.danger { color: var(--danger); }
    .stat-sub { font-size: 11px; color: var(--muted); margin-top: 6px; }

    /* GRIDS */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }

    /* CARD */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-action { font-size: 12px; color: var(--accent); cursor: pointer; font-weight: 400; }

    /* TABLE */
    .data-table { width: 100%; border-collapse: collapse; }

    .data-table th {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 10px 14px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    .data-table td {
      padding: 12px 14px;
      border-bottom: 1px solid rgba(0,198,255,0.05);
      font-size: 13px;
    }

    .data-table tr:last-child td { border-bottom: none; }
    .data-table tbody tr:hover td { background: rgba(0,198,255,0.04); }
    .data-table tbody tr { cursor: pointer; }

    /* BADGES */
    .badge {
      display: inline-flex;
      align-items: center;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 20px;
    }

    .b-green  { background: rgba(0,230,118,0.12);  color: var(--green);   border: 1px solid rgba(0,230,118,0.25); }
    .b-yellow { background: rgba(255,179,0,0.12);  color: var(--warning); border: 1px solid rgba(255,179,0,0.25); }
    .b-red    { background: rgba(255,77,77,0.12);  color: var(--danger);  border: 1px solid rgba(255,77,77,0.25); }
    .b-blue   { background: rgba(0,198,255,0.12);  color: var(--accent);  border: 1px solid rgba(0,198,255,0.25); }
    .b-gray   { background: rgba(122,143,168,0.12); color: var(--muted);  border: 1px solid rgba(122,143,168,0.2); }

    /* FILTERS */
    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      align-items: center;
    }

    .filter-select {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 13px;
      color: var(--text);
      cursor: pointer;
      outline: none;
    }

    .filter-select:hover { border-color: var(--border-strong); }
    .spacer { flex: 1; }

    /* ALERT ITEMS */
    .alert-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 11px 0;
      border-bottom: 1px solid rgba(0,198,255,0.06);
    }

    .alert-item:last-child { border-bottom: none; }

    .adot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 4px;
    }

    .adot.r { background: var(--danger); }
    .adot.y { background: var(--warning); }
    .adot.b { background: var(--accent); }
    .adot.g { background: var(--green); }

    .alert-body { flex: 1; }
    .alert-title { font-size: 13px; font-weight: 500; color: var(--text); }
    .alert-desc  { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .alert-time  { font-size: 11px; color: var(--muted); white-space: nowrap; }

    /* TCO ROWS */
    .tco-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(0,198,255,0.06);
    }

    .tco-row:last-child { border-bottom: none; }

    .tco-icon {
      width: 32px; height: 32px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
    }

    .bar-bg { height: 4px; background: rgba(0,198,255,0.08); border-radius: 2px; margin-top: 5px; }
    .bar-fg { height: 100%; border-radius: 2px; }

    /* SETTINGS */
    .settings-section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 16px;
    }

    .settings-title { font-size: 14px; font-weight: 600; margin-bottom: 16px; }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 14px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }

    .form-input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 13px;
      color: var(--text);
      outline: none;
    }

    .form-input:focus { border-color: var(--accent); }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 0;
      border-bottom: 1px solid rgba(0,198,255,0.06);
    }

    .toggle-row:last-child { border-bottom: none; }
    .toggle-info { flex: 1; margin-right: 16px; }
    .toggle-label { font-size: 13px; font-weight: 500; }
    .toggle-desc  { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .toggle {
      width: 40px; height: 22px;
      background: rgba(122,143,168,0.2);
      border-radius: 11px;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
      transition: background 0.2s;
    }

    .toggle.on { background: rgba(0,198,255,0.3); }

    .toggle::after {
      content: '';
      width: 16px; height: 16px;
      background: var(--muted);
      border-radius: 50%;
      position: absolute;
      top: 3px; left: 3px;
      transition: all 0.2s;
    }

    .toggle.on::after { left: 21px; background: var(--accent); }

    .integration-row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 0;
      border-bottom: 1px solid rgba(0,198,255,0.06);
    }

    .integration-row:last-child { border-bottom: none; }

    .int-icon {
      width: 40px; height: 40px;
      border-radius: 10px;
      background: rgba(0,198,255,0.07);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .int-name { font-size: 13px; font-weight: 600; }
    .int-desc { font-size: 11px; color: var(--muted); margin-top: 2px; }

    /* BACK */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
      margin-bottom: 20px;
      transition: color 0.15s;
    }

    .back-btn:hover { color: var(--text); }

    /* VEHICLE HEADER */
    .vehicle-header {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 20px;
    }

    .v-icon {
      width: 56px; height: 56px;
      border-radius: 12px;
      background: rgba(0,198,255,0.1);
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      flex-shrink: 0;
    }

    @media (max-width: 800px) {
      :root { --sidebar-w: 0px; }
      .sidebar { display: none; }
      .grid-2 { grid-template-columns: 1fr; }
    }
  </style>
</head>

  dashboard:'Dashboard', frota:'Frota', veiculo:'Veículo', abastecimento:'Abastecimento',
  manutencao:'Manutenção', pneus:'Pneus', pedagios:'Pedágios', multas:'Multas',
  relatorios:'Relatórios', configuracoes:'Configurações',
};

function go(screen, vid) {
  currentScreen = screen;
  if (vid !== undefined) selectedVehicleId = vid;

  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.screen === screen);
  });

  document.getElementById('breadcrumb').textContent = labels[screen] || screen;

  const map = {
    dashboard:     renderDashboard,
    frota:         renderFrota,
    veiculo:       renderVeiculo,
    abastecimento: renderAbastecimento,
    manutencao:    renderManutencao,
    pneus:         renderPneus,
    pedagios:      renderPedagios,
    multas:        renderMultas,
    relatorios:    renderRelatorios,
    configuracoes: renderConfig,
  };

  document.getElementById('content').innerHTML = (map[screen] || (() => '<p style="color:var(--muted);padding:24px">Em construção</p>'))();
  window.scrollTo(0,0);
}

const R = v => 'R$ ' + v.toLocaleString('pt-BR', { minimumFractionDigits:2, maximumFractionDigits:2 });
const KM = v => v.toLocaleString('pt-BR') + ' km';

function badge(s) {
  const m = {
    'Ativo':'b-green','Concluído':'b-green','Normal':'b-green','Pago':'b-green',
    'Manutenção':'b-yellow','Agendado':'b-yellow','Atenção':'b-yellow',
    'Em andamento':'b-blue',
    'Pendente':'b-red','Crítico':'b-red','Inativo':'b-gray',
  };
  return `<span class="badge ${m[s]||'b-gray'}">${s}</span>`;
}

function vehicleIcon(tipo) {
  return tipo === 'Van' ? '🚐' : tipo === 'Utilitário' ? '🚙' : '🚛';
}

function renderPneus() {
  return `
    <div class="page-header">
      <div>
        <div class="page-title">Pneus</div>
        <div class="page-subtitle">${tires.length} pneus monitorados</div>
      </div>
      <button class="btn btn-primary">+ Registrar troca</button>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Monitorados</div>
        <div class="stat-value">${tires.length}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Em atenção</div>
        <div class="stat-value warning">${tires.filter(t=>t.status==='Atenção').length}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Críticos</div>
        <div class="stat-value danger">${tires.filter(t=>t.status==='Crítico').length}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Normais</div>
        <div class="stat-value green">${tires.filter(t=>t.status==='Normal').length}</div>
      </div>
    </div>

    <div class="card" style="padding:0;overflow:hidden">
      <table class="data-table">
        <thead>
          <tr><th>Veículo</th><th>Posição</th><th>Marca / Modelo</th><th>KM rodados</th><th>Vida útil (80k km)</th><th>Status</th></tr>
        </thead>
        <tbody>
          ${tires.map(t => {
            const pct = Math.min(100, Math.round((t.km_uso / 80000) * 100));
            const color = pct > 90 ? 'var(--danger)' : pct > 75 ? 'var(--warning)' : 'var(--green)';
            return `
              <tr>
                <td>
                  <div style="font-weight:500">${t.veiculo}</div>
                  <div style="font-size:11px;color:var(--muted);font-family:monospace">${t.placa}</div>
                </td>
                <td style="color:var(--muted)">${t.posicao}</td>
                <td>
                  <div style="font-weight:500">${t.marca}</div>
                  <div style="font-size:11px;color:var(--muted)">${t.modelo}</div>
                </td>
                <td>${KM(t.km_uso)}</td>
                <td style="min-width:140px">
                  <div style="display:flex;align-items:center;gap:8px">
                    <div style="flex:1">
                      <div class="bar-bg"><div class="bar-fg" style="width:${pct}%;background:${color}"></div></div>
                    </div>
                    <div style="font-size:11px;color:${color};font-weight:600;white-space:nowrap">${pct}%</div>
                  </div>
                </td>
                <td>${badge(t.status)}</td>
              </tr>
            `;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

    { icon:'📋', title:'Multas e Infrações',      desc:'Relatório completo de infrações por veículo e condutor, com ranking.',              tag:'Compliance',  tc:'b-red' },

    { icon:'◎',  title:'Vida Útil dos Pneus',    desc:'Desgaste e previsão de troca por posição e veículo.',                              tag:'Operacional', tc:'b-green' },
    { icon:'👤', title:'Desempenho por Condutor', desc:'Consumo, multas e custos agrupados por motorista para análise de comportamento.',  tag:'RH',          tc:'b-yellow' },
  ];

  return `
    <div class="page-header">
      <div>
        <div class="page-title">Relatórios</div>
        <div class="page-subtitle">Exporte e analise dados da frota</div>
      </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px">
      ${reports.map(r => `
        <div class="card" style="cursor:pointer;transition:border-color 0.2s"
             onmouseover="this.style.borderColor='rgba(0,198,255,0.3)'"
             onmouseout="this.style.borderColor='rgba(0,198,255,0.1)'">
          <div style="font-size:28px;margin-bottom:12px">${r.icon}</div>
          <div style="font-size:15px;font-weight:600;margin-bottom:6px">${r.title}</div>

            <span style="font-size:12px;color:var(--accent);cursor:pointer">Gerar PDF →</span>
          </div>
        </div>
      `).join('')}

  `;
}
